name: kazumi
description: "Playra shell: minimal app architecture with a retained playback kernel."
publish_to: "none"
version: 3.0.0+30000

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.47.6

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 应用骨架：路由/DI、状态、存储。
  flutter_modular: ^7.1.0
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  path: any
  synchronized: any

  # 网络、代理与图片缓存。
  dio: ^5.11.0
  http: ^1.6.0
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # 播放内核。
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 803c4a27912091db6f839d48d1b984a0d9f588c7
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 803c4a27912091db6f839d48d1b984a0d9f588c7
      path: ./media_kit_video
  audio_service: ^0.18.15
  audio_service_mpris:
    git:
      url: https://github.com/Predidit/audio-service-mpris.git
      ref: d30b53fb7dbdd8f10ceda7447fe0a0218711a220
  audio_service_win:
    git:
      url: https://github.com/Predidit/audio_service_win.git
      ref: 8ad650c6eb487208b9861d44755c8e58db061c88
  audio_session: ^0.2.2
  audio_video_progress_bar: ^2.0.2
  flutter_volume_controller: ^2.0.1
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.2
  screen_brightness_platform_interface: ^2.1.0
  saver_gallery: ^4.1.0
  dlna_dart: ^0.1.1

  # 桌面与平台能力。
  window_manager: ^0.5.1
  win32: ^5.15.0
  ffi: ^2.1.0
  url_launcher: ^6.3.0
  open_filex: ^4.7.0
  file_picker: ^10.3.7

  # 主题与控件。
  forui: 0.27.7
  flutter_svg: ^2.2.3

  # 工具。
  logger: ^2.6.2
  web: ^1.1.1

dev_dependencies:
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.5
  hive_ce_generator: ^1.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
  msix: ^3.16.12

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/logo/logo_android.png
  image_path_android: assets/images/logo/logo_android.png
  image_path_ios: assets/images/logo/logo_ios.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/logo/logo_android.png
  adaptive_icon_monochrome: assets/images/logo/logo_android.png
  macos:
    generate: true
    image_path: assets/images/logo/logo_rounded.png
  windows:
    generate: true
    image_path: assets/images/logo/logo_rounded.png
    icon_size: 256

flutter_native_splash:
  android: false
  ios: true
  web: false
  color_ios: "#ffffff"
  color_dark_ios: "#212121"
  image_ios: assets/images/logo/logo_ios.png
  image_dark_ios: assets/images/logo/logo_ios.png

msix_config:
  display_name: Playra
  publisher: CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US
  logo_path: assets/images/logo/logo_rounded.png
  sign_msix: false
  install_certificate: false
  build_windows: false
  protocol_activation: kazumi

flutter:
  uses-material-design: true
  shaders:
    - assets/runtime_shaders/liquid_navigation.frag
  assets:
    - assets/images/forward_80.png
    - assets/images/logo/
    - assets/shaders/
  fonts:
    - family: MI_Sans_Regular
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
