plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def releaseKeyProperties = new Properties()
def releaseKeyFile = rootProject.file('key.properties')
if (releaseKeyFile.exists()) {
    releaseKeyFile.withReader('UTF-8') { releaseKeyProperties.load(it) }
}

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDir layout.buildDirectory.dir("luminaJni")
    }

    // Lumina 通过 nativeLibraryDir 加载只读引擎，不从可写缓存目录执行。
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.predidit.kazumi"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        if (releaseKeyFile.exists()) {
            release {
                storeFile rootProject.file(releaseKeyProperties['storeFile'])
                storePassword releaseKeyProperties['storePassword']
                keyAlias releaseKeyProperties['keyAlias']
                keyPassword releaseKeyProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig releaseKeyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// 仅复制固定接入模块和标准库 SDK，不把诊断脚本/电脑身份打进 APK。
def embeddedPythonDir = layout.buildDirectory.dir("embeddedPython")
def stageEmbeddedPython = tasks.register("stageEmbeddedPython", Sync) {
    doFirst {
        def sdkDir = file("../../tool/source_runtime/vendor/miomedia")
        def required = ["__init__.py", "block.py", "client.py", "config.py", "device.py",
                        "playback.py", "profile.py", "selftest.py", "signature.py",
                        "suite.py", "transport.py", "bf_tables.bin"]
        if (!required.every { new File(sdkDir, it).isFile() }) {
            throw new GradleException("Missing private SDK input: docs/release/build-inputs.zh.md")
        }
        def animeSdk = file("../../tool/source_runtime/vendor/anifive")
        if (!["__init__.py", "client.py", "transport.py", "profile.py", "source_a.py", "source_b.py", "source_c.py", "source_d.py", "codec.py", "selector.py", "config.py", "clarity.py"].every { new File(animeSdk, it).isFile() }) {
            throw new GradleException("Missing AniFive SDK: run tool/source_runtime/import_anifive.py")
        }
        def luminaSdk = file("../../tool/source_runtime/vendor/lumina")
        if (!["__init__.py", "client.py", "block.py", "auth.py", "envelope.py", "play.py", "profile.py", "config.py", "_fuse/__init__.py", "_fuse/assets/fuse_image.bin.gz"].every { new File(luminaSdk, it).isFile() }) {
            throw new GradleException("Missing Lumina SDK: run tool/source_runtime/import_lumina.py; see docs/release/build-inputs.zh.md")
        }
        // 导入收据与原SDK摘要一致，才能把对应算法和资源打入应用。
        def manifest = new groovy.json.JsonSlurper().parse(file("../../tool/source_runtime/vendor/lumina-manifest.json"))
        manifest.files.each { row ->
            def input = new File(luminaSdk, row.file)
            if (!input.isFile() || input.length() != row.size ||
                java.security.MessageDigest.getInstance("SHA-256").digest(input.bytes).encodeHex().toString() != row.sha256 ||
                (!(row.file in ["config.py", "profile.py"]) && row.sha256 != row.upstreamSha256)) {
                throw new GradleException("Lumina SDK integrity check failed")
            }
        }
        // 此段仅检查既有 Mio 桥，不是为 Lumina 安装缺失后端。
        if (new File(sdkDir, "suite.py").getText("UTF-8").contains("import _native") &&
            !new File(sdkDir, "_native/__init__.py").isFile()) {
            throw new GradleException("Missing private SDK accelerator bridge: _native/__init__.py")
        }
    }
    from("../../tool/source_runtime") {
        include "adapters.py", "miomedia_adapter.py", "miomedia_quality.py", "android_bridge.py"
        include "dispatch.py", "anifive_adapter.py", "anifive_transport.py", "vendor/anifive/*.py"
        include "vendor/__init__.py", "vendor/miomedia/*.py"
        include "vendor/miomedia/_native/__init__.py"
        // M6 的固定查表资源由原样 SDK 读取，不能只打包 Python 模块。
        include "vendor/miomedia/bf_tables.bin"
        include "lumina_adapter.py", "vendor/lumina/*.py", "vendor/lumina/_fuse/__init__.py"
        include "vendor/lumina/_fuse/assets/fuse_image.bin.gz"
    }
    into(embeddedPythonDir)
}
def stageLuminaJni = tasks.register("stageLuminaJni", Sync) {
    from("../../tool/source_runtime/vendor/lumina/_fuse/assets/liblumafuse_android_arm64.so") {
        into "arm64-v8a"
        rename { "liblumafuse.so" }
    }
    from("../../tool/source_runtime/vendor/lumina/_fuse/assets/liblumafuse_android_x64.so") {
        into "x86_64"
        rename { "liblumafuse.so" }
    }
    into layout.buildDirectory.dir("luminaJni")
}
chaquopy {
    defaultConfig {
        version = "3.11"
        // SDK 用真实文件路径读取镜像；只提取需要文件系统的最深层包。
        extractPackages("vendor.lumina._fuse")
        def configuredPython = System.getenv("PLAYRA_BUILD_PYTHON")
        if (configuredPython) { buildPython(configuredPython) }
    }
    sourceSets {
        getByName("main") { srcDir(embeddedPythonDir.get().asFile) }
    }
}
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("PythonSources") }.configureEach {
    dependsOn(stageEmbeddedPython)
}
tasks.named("preBuild").configure {
    dependsOn(stageEmbeddedPython, stageLuminaJni)
}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
