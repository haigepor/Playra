plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def releaseKeyProperties = new Properties()
def releaseKeyFile = rootProject.file('key.properties')
if (releaseKeyFile.exists()) {
    releaseKeyFile.withReader('UTF-8') { releaseKeyProperties.load(it) }
}

// Flutter 的 target-platform 与 APK 原生库筛选保持一致。
def flutterAbiByPlatform = [
    "android-arm": "armeabi-v7a",
    "android-arm64": "arm64-v8a",
    "android-x64": "x86_64"
]
def targetPlatformsForApk = project.hasProperty("target-platform")
    ? project.property("target-platform").toString().split(",", -1).toList()
    : flutterAbiByPlatform.keySet().toList()
def targetAbisForApk = targetPlatformsForApk.collect { platform ->
    def abi = flutterAbiByPlatform[platform]
    if (abi == null) {
        throw new GradleException("Unsupported Flutter target-platform: ${platform}")
    }
    abi
}.unique()
def splitApkByAbi = (project.findProperty('split-per-abi') ?: 'false').toString().toBoolean()

android {
    buildFeatures {
        buildConfig = true
        compose = true
    }
    namespace "com.example.kazumi"
    compileSdk rootProject.playraCompileSdk
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Lumina 通过 nativeLibraryDir 加载只读引擎，不从可写缓存目录执行。
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // 保持私有输入原始字节，使 APK 库摘要能直接对照导入收据。
            keepDebugSymbols += ["**/liblumafuse.so"]
            keepDebugSymbols += ["**/liblumina_core_vendor.so"]
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.predidit.kazumi"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            // Flutter 插件预填了默认 ABI；必须先清空，不能把单架构请求追加为三架构。
            abiFilters.clear()
            // 分 ABI 构建由 Flutter 的 splits 选择架构，AGP 不允许同时设置两套筛选。
            if (!splitApkByAbi) abiFilters.addAll(targetAbisForApk)
        }
    }

    signingConfigs {
        if (releaseKeyFile.exists()) {
            release {
                storeFile rootProject.file(releaseKeyProperties['storeFile'])
                storePassword releaseKeyProperties['storePassword']
                keyAlias releaseKeyProperties['keyAlias']
                keyPassword releaseKeyProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig releaseKeyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "io.github.kyant0:backdrop:2.0.1"
    implementation "io.github.kyant0:shapes:1.2.1"
    implementation "org.jetbrains.compose.foundation:foundation:1.12.0"
    implementation "org.jetbrains.compose.ui:ui:1.12.0"
    implementation "org.jetbrains.compose.ui:ui-text:1.12.0"
    implementation "androidx.savedstate:savedstate:1.3.3"
}
