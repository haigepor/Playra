name: Playra quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pinned Lumina native input
        env:
          PLAYRA_LUMINA_NATIVE_INPUT_URL: ${{ secrets.PLAYRA_LUMINA_NATIVE_INPUT_URL }}
          PLAYRA_LUMINA_NATIVE_INPUT_SHA256: ${{ secrets.PLAYRA_LUMINA_NATIVE_INPUT_SHA256 }}
          PLAYRA_LUMINA_INPUT_PASSPHRASE: ${{ secrets.PLAYRA_LUMINA_INPUT_PASSPHRASE }}
        run: node tool/lumina-native-input.cjs restore
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libmpv-dev
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: node --test tool/lumina-native-input.test.cjs
      - run: flutter test
      - run: python -m unittest discover -s tool -p test_cloud_build.py
