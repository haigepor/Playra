name: Playra release build
on:
  push:
    tags: ['playra/v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playra-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.repository == 'haigepor/Playra'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: playra-web-${{ github.ref_name }}
          path: build/web
          if-no-files-found: error
