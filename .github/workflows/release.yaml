name: Playra Android and Web build
on:
  push:
    tags: ['playra/v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playra-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'haigepor/Playra'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Validate product version
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^version: ([^+\n]+)', Path('pubspec.yaml').read_text(), re.M).group(1)
          if os.environ['BUILD_REF_TYPE'] == 'tag':
              assert os.environ['BUILD_REF_NAME'] == 'playra/v' + version, 'Playra tag/version mismatch'
          PY
      - name: Import private SDK
        env:
          MIOMEDIA_SDK_BUNDLE_1: ${{ secrets.MIOMEDIA_SDK_BUNDLE_1 }}
          MIOMEDIA_SDK_BUNDLE_2: ${{ secrets.MIOMEDIA_SDK_BUNDLE_2 }}
        run: python tool/miomedia_sdk_input.py import-env
      - name: Configure release signing
        env:
          KEYSTORE_DATA: ${{ secrets.PLAYRA_ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.PLAYRA_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLAYRA_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAYRA_ANDROID_KEY_ALIAS }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['KEYSTORE_DATA', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS']
          if not all(os.environ.get(n) for n in names):
              raise SystemExit('Release signing inputs are required; see docs/release/build-inputs.zh.md')
          Path('android/playra-release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_DATA'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          properties = {'storeFile': 'playra-release.jks', 'storePassword': os.environ['STORE_PASSWORD'],
                        'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          Path('android/key.properties').write_text(''.join(k + '=' + escape(v) + '\n' for k, v in properties.items()))
          PY
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libmpv-dev
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: python -m unittest discover -s tool -p test_miomedia_sdk_input.py
      - run: python -m unittest discover -p 'test_*.py'
        working-directory: tool/source_runtime
      - run: python selftest.py
        working-directory: tool/source_runtime/vendor/miomedia
      - run: python -m miomedia.selftest
        working-directory: tool/source_runtime/vendor
      - name: Build Android
        run: flutter build apk --release --dart-define=PLAYRA_DIAGNOSTICS=false
      - name: Build Web
        run: flutter build web --release --dart-define=PLAYRA_DIAGNOSTICS=false
      - name: Package outputs
        run: |
          mkdir -p build/playra-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk build/playra-artifacts/Playra_android.apk
          tar -czf build/playra-artifacts/Playra_web.tar.gz -C build/web .
          sha256sum build/playra-artifacts/* > build/playra-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Playra-build
          path: build/playra-artifacts/
          if-no-files-found: error
